<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BarMap — Notez vos bars</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bt:#0f2a25;--fo:#f4f6ef;--lg:#e9b422;--ink:#14201d;--mu:#5d6b66;--ln:#d9ded3;--ok:#2f9e5b;--mid:#d9801a;--ko:#cf4a3c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:var(--fo)}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;position:relative}
header{position:relative;z-index:1100;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--bt);color:var(--fo)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.02em;margin-right:auto}
.logo i{width:20px;height:20px;border-radius:50%;background:var(--lg);box-shadow:inset 0 0 0 4px var(--bt),0 0 0 2px var(--lg)}
#srch{position:relative;flex:1 1 180px;max-width:520px;order:2}
input,textarea{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--lg);outline-offset:1px}
#res{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;color:var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px #0004;max-height:50vh;overflow-y:auto}
.it{padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;border-bottom:1px solid var(--ln)}.it:hover{background:var(--fo)}
.it span,.sub{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--lg);color:var(--bt);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:transparent;color:inherit;border:1px solid currentColor;font-weight:600}.btn:disabled{opacity:.5}
header .btn{order:3}
@media(max-width:640px){#srch{order:5;flex-basis:100%;max-width:none}}
#mapw{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0;background:#dfe5dc}
.co{width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--ok);box-shadow:0 0 0 2px #fff,0 2px 8px #0006;font-weight:800;font-size:12.5px;line-height:26px;text-align:center;font-variant-numeric:tabular-nums}
.dot{width:16px;height:16px;border-radius:50%;background:#7b8883;border:2px solid #fff;box-shadow:0 1px 4px #0005}
.leaflet-tooltip.tip{padding:0;border:0;background:transparent;box-shadow:none;white-space:normal;font:inherit}.leaflet-tooltip.tip:before{display:none}
.tw{width:176px;background:#fff;color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 6px 20px #0005}
.tw img{display:block;width:176px;height:110px;object-fit:cover;background:var(--ln)}
.tw div{padding:7px 10px;line-height:1.25}.tw b{display:block}.tw span{color:var(--mu);font-size:13px}
#hint,#zh{position:absolute;z-index:900;background:var(--bt);color:var(--fo);padding:8px 12px;border-radius:8px;font-size:14px}
#hint{left:50%;transform:translateX(-50%);top:10px;display:flex;gap:10px;align-items:center;max-width:92%}
#zh{left:10px;bottom:34px;max-width:calc(100% - 20px)}
#zh .btn{padding:4px 10px;margin-left:8px;font-size:13px}
.ld{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e9b422;border:2px solid #fff;margin:0 5px -2px 4px}
.lbl span{position:absolute;top:-8px;white-space:nowrap;font-weight:700;font-size:12px;color:#0f2a25;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
#sheet{position:absolute;z-index:1100;left:0;right:0;bottom:20px;max-height:72%;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px 20px;box-shadow:0 -10px 30px #0004}
@media(min-width:760px){#sheet{top:0;bottom:0;left:auto;width:390px;max-height:none;border-radius:0}}
#sheet h2{margin:0 34px 2px 0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}#sheet h3{margin:18px 0 6px;font-size:16px}
#sheet label{display:block;margin-top:10px;font-size:13px;color:var(--mu)}#sheet label input{margin-top:4px}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:30px;cursor:pointer;line-height:1;color:var(--ink)}
.agg{display:flex;align-items:baseline;gap:8px;margin:10px 0}.agg .btn{margin-left:auto;padding:6px 12px;color:var(--bt)}
.big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
#st button{border:0;background:none;font-size:32px;color:var(--ln);cursor:pointer;padding:0 2px}#st button.on{color:var(--lg)}
#sheet input+textarea,#sheet #st+input{margin-top:6px}textarea{resize:vertical;margin-top:6px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}.row .btn:last-child{margin-left:auto}.row .btn.sec{color:var(--ink)}
.rv{border-top:1px solid var(--ln);padding:10px 0}.rv p{margin:4px 0;white-space:pre-wrap;word-break:break-word}.stars{color:var(--lg);letter-spacing:1px}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:92px;height:92px;object-fit:cover;border-radius:8px;background:var(--fo)}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:3000;max-width:90%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo"><i></i>BarMap</span>
    <div id="srch"><input id="q" type="search" placeholder="Rechercher un bar ou une ville, puis Entrée" autocomplete="off"><div id="res" hidden></div></div>
    <button class="btn sec" id="loc" title="Aller à ma position">Ma position</button>
    <button class="btn" id="add">Ajouter un bar</button>
    <button class="btn sec" id="auth">Connexion</button>
  </header>
  <div id="mapw">
    <div id="map"></div>
    <div id="hint" hidden>Touchez la carte à l’emplacement du bar <button class="btn sec" id="cx">Annuler</button></div>
    <div id="zh">Chargement de la carte…</div>
  </div>
  <aside id="sheet" hidden></aside>
</div>
<div id="toast" role="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<script src="config.js"></script>
<script>
const CONFIG=window.BARMAP_CONFIG||{url:"https://exemple.supabase.co",key:"manquant"}; // défini dans config.js
const sb=supabase.createClient(CONFIG.url,CONFIG.key);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(+n).toFixed(1).replace(".",",");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),4000)}
if(!window.BARMAP_CONFIG)setTimeout(()=>toast("Fichier config.js manquant : créez-le à côté de index.html."),600);
let session=null,dbBars=new Map(),osm=[],sel=null,addMode=false,draft={r:0,files:[]},seq=0,found=[];

/* ---------- Carte ---------- */
const map=L.map("map",{attributionControl:false,preferCanvas:true}).setView([46.6,2.4],6);
L.control.attribution({position:"bottomleft"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const gBars=L.layerGroup().addTo(map),gTmp=L.layerGroup().addTo(map);
let tm;map.on("moveend",()=>{clearTimeout(tm);tm=setTimeout(load,350)});
map.on("click",e=>{$("#res").hidden=true;if(!addMode)return;addMode=false;$("#hint").hidden=true;show({id:null,manual:true,name:"",lat:e.latlng.lat,lng:e.latlng.lng})});
map.on("locationerror",()=>toast("Position indisponible : autorisez la localisation dans votre navigateur."));
$("#loc").onclick=()=>map.locate({setView:true,maxZoom:16});

function st(h){$("#zh").innerHTML=h}
$("#zh").onclick=e=>{if(e.target.id=="rt")load()};
async function overpass(q){ // serveur principal, puis serveur de secours
  for(const u of["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q)});if(r.ok)return await r.json()}catch{}}
  throw new Error("overpass")}
async function load(){
  const my=++seq,b=map.getBounds(),z=map.getZoom();
  const{data,error}=await sb.from("bars_stats").select("*").gte("lat",b.getSouth()).lte("lat",b.getNorth()).gte("lng",b.getWest()).lte("lng",b.getEast()).limit(500);
  if(my!=seq)return;
  if(error)return toast("Chargement impossible : "+(error.message||error));
  dbBars=new Map(data.map(r=>[r.id,r]));osm=[];draw();
  if(z<12)return st("Zoomez sur une ville pour voir tous les bars d’OpenStreetMap");
  st("Recherche des bars…");
  try{ // bars référencés sur OpenStreetMap dans la zone visible
    const j=await overpass(`[out:json][timeout:25];nwr["amenity"~"^(bar|pub)$"]["name"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out center 1500;`);
    if(my!=seq)return;
    osm=j.elements.map(e=>({id:null,osm_id:e.type+"/"+e.id,name:e.tags.name,lat:e.lat??(e.center&&e.center.lat),lng:e.lon??(e.center&&e.center.lon),address:[e.tags["addr:housenumber"],e.tags["addr:street"],e.tags["addr:city"]].filter(Boolean).join(" ")})).filter(x=>x.lat!=null);
    const nb=draw();
    st(nb?`<b>${nb} bar${nb>1?"s":""}</b> dans cette zone <i class="ld"></i>pas encore noté${j.elements.length>=1500?" · affichage limité, zoomez pour tout voir":""}`:"Aucun bar dans cette zone. Déplacez ou dézoomez la carte.")
  }catch{if(my==seq)st('Bars OpenStreetMap indisponibles pour le moment <button class="btn" id="rt">Réessayer</button>')}}
function draw(){
  gBars.clearLayers();let k=0;const z=map.getZoom();
  const known=new Set([...dbBars.values()].map(b=>b.osm_id).filter(Boolean));
  const put=b=>{mk(b);if(z>=16)lbl(b);k++};
  osm.forEach(o=>{if(!known.has(o.osm_id))put(o)});dbBars.forEach(put);return k}
function lbl(b){ // nom affiché à côté du point à fort zoom
  L.marker([b.lat,b.lng],{icon:L.divIcon({className:"lbl",html:`<span style="left:${+b.moy?22:13}px">${esc(b.name)}</span>`,iconSize:[0,0]}),interactive:false,keyboard:false}).addTo(gBars)}
function mk(b){
  const n=+b.moy||0,c=n>=4?"var(--ok)":n>=3?"var(--mid)":"var(--ko)";
  const img=b.photo?`<img src="${esc(sb.storage.from("photos").getPublicUrl(b.photo).data.publicUrl)}" alt="">`:"";
  const tip=`<div class="tw">${img}<div><b>${esc(b.name)}</b><span>${n?"★ "+fmt(n)+" · "+b.n+" avis":"Pas encore noté"}</span></div></div>`;
  const o={className:"tip",opacity:1,direction:"top"};
  if(!n)return L.circleMarker([b.lat,b.lng],{radius:8,weight:2.5,color:"#0f2a25",fillColor:"#e9b422",fillOpacity:1,bubblingMouseEvents:false}).bindTooltip(tip,{...o,offset:[0,-9]}).on("click",()=>show(b)).addTo(gBars);
  L.marker([b.lat,b.lng],{icon:L.divIcon({className:"",html:`<div class="co" style="border-color:${c}">${fmt(n)}</div>`,iconSize:[34,34],iconAnchor:[17,17],tooltipAnchor:[0,-19]}),riseOnHover:true,zIndexOffset:500}).bindTooltip(tip,o).on("click",()=>show(b)).addTo(gBars)}

/* ---------- Recherche (Entrée) ---------- */
$("#q").addEventListener("keydown",e=>{if(e.key=="Enter")search()});
async function search(){
  const v=$("#q").value.trim();if(v.length<2)return;
  const like="%"+v.replace(/[%_,()]/g,"")+"%";
  const[a,n]=await Promise.all([
    sb.from("bars_stats").select("*").ilike("name",like).limit(5),
    fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=fr&q="+encodeURIComponent(v)).then(r=>r.json()).catch(()=>[])]);
  found=[...(a.data||[]).map(b=>({t:b.name,s:(b.moy?"★ "+fmt(b.moy)+" · ":"")+(b.address||""),go:()=>show(b,true)})),
    ...n.map(p=>{const nm=p.name||p.display_name.split(",")[0];
      return p.category=="amenity"&&["bar","pub","biergarten"].includes(p.type)
        ?{t:nm,s:p.display_name,go:()=>show({id:null,osm_id:p.osm_type+"/"+p.osm_id,name:nm,address:p.display_name.split(",").slice(1,3).join(",").trim(),lat:+p.lat,lng:+p.lon},true)}
        :{t:nm,s:"Lieu · "+p.display_name,go:()=>map.flyTo([+p.lat,+p.lon],p.addresstype=="city"?12:15)}})];
  $("#res").innerHTML=found.length?found.map((f,i)=>`<div class="it" data-i="${i}"><b>${esc(f.t)}</b><span>${esc(f.s)}</span></div>`).join(""):`<div class="it"><span>Aucun résultat. Essayez un autre nom ou ajoutez le bar.</span></div>`;
  $("#res").hidden=false}
$("#res").onclick=e=>{const it=e.target.closest("[data-i]");if(it){$("#res").hidden=true;found[+it.dataset.i].go()}};

/* ---------- Fiche d’un bar ---------- */
async function show(b,fly){
  if(!b.id&&b.osm_id){const r=await sb.from("bars_stats").select("*").eq("osm_id",b.osm_id).maybeSingle();if(r.data)b=r.data}
  sel=b;addMode=false;$("#hint").hidden=true;draft={r:0,files:[]};gTmp.clearLayers();
  if(b.manual)L.circleMarker([b.lat,b.lng],{radius:9,color:"#fff",weight:3,fillColor:"#e9b422",fillOpacity:1}).addTo(gTmp);
  if(fly)map.flyTo([b.lat,b.lng],Math.max(map.getZoom(),17));
  if(b.id)try{history.replaceState(null,"","#bar-"+b.id)}catch{}
  const s=$("#sheet");s.hidden=false;s.scrollTop=0;
  s.innerHTML=`<button class="x" id="cl" aria-label="Fermer">×</button>`+
    (b.manual?`<h2>Nouveau bar</h2><label>Nom du bar<input id="nm" maxlength="120"></label>`:`<h2>${esc(b.name)}</h2><div class="sub">${esc(b.address||"")}</div>`)+
    `<div class="agg">${b.moy?`<span class="big">${fmt(b.moy)}</span><span class="sub">sur 5 · ${b.n} avis</span>`:`<span class="sub">Pas encore d’avis. Lancez-vous !</span>`}${b.id?`<button class="btn" id="sh">Partager</button>`:""}</div>
    <div id="revs"></div><h3>Votre avis</h3>
    <div id="st">${[1,2,3,4,5].map(i=>`<button data-r="${i}" aria-label="${i} étoiles">★</button>`).join("")}</div>
    <input id="ps" maxlength="40" placeholder="Votre pseudo" value="${esc(localStorage.getItem("pseudo")||"")}">
    <textarea id="cm" rows="3" maxlength="600" placeholder="Ambiance, prix, cocktail préféré…"></textarea>
    <input id="ph" type="file" accept="image/*" multiple hidden>
    <div class="row"><button class="btn sec" id="pb">Ajouter des photos</button><span class="sub" id="pn"></span><button class="btn" id="go">${session?"Publier l’avis":"Se connecter pour publier"}</button></div>`;
  $("#cl").onclick=close;
  $("#st").onclick=e=>{const x=e.target.closest("[data-r]");if(!x)return;draft.r=+x.dataset.r;[...$("#st").children].forEach((y,i)=>y.classList.toggle("on",i<draft.r))};
  $("#pb").onclick=()=>$("#ph").click();
  $("#ph").onchange=e=>{draft.files=[...draft.files,...e.target.files].slice(0,6);e.target.value="";$("#pn").textContent=draft.files.length+" photo(s)"};
  $("#go").onclick=publish;
  if(b.id){$("#sh").onclick=share;loadRevs(b.id)}}
function close(){sel=null;$("#sheet").hidden=true;gTmp.clearLayers();try{history.replaceState(null,"",location.pathname+location.search)}catch{}}
async function loadRevs(id){
  const{data}=await sb.from("reviews").select("*").eq("bar_id",id).order("created_at",{ascending:false}).limit(50);
  if(!sel||sel.id!=id||!$("#revs"))return;
  $("#revs").innerHTML=(data||[]).map(r=>`<div class="rv"><div class="sub"><span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span> ${esc(r.author)} · ${new Date(r.created_at).toLocaleDateString("fr-FR")}</div>${r.comment?`<p>${esc(r.comment)}</p>`:""}<div class="ph">${r.photos.map(p=>{const u=esc(sb.storage.from("photos").getPublicUrl(p).data.publicUrl);return`<a href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="${u}" alt="Photo du bar"></a>`}).join("")}</div></div>`).join("")}
async function share(){const url=location.origin+location.pathname+"#bar-"+sel.id;try{if(navigator.share)await navigator.share({title:sel.name,url});else{await navigator.clipboard.writeText(url);toast("Lien copié")}}catch{}}

/* ---------- Publication ---------- */
async function shrink(f){try{const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.8))||f}catch{return f}}
async function publish(){
  if(!session)return login();
  if(!draft.r)return toast("Choisissez une note de 1 à 5 étoiles.");
  let b=sel;if(b.manual){b={...b,name:$("#nm").value.trim()};if(!b.name)return toast("Donnez un nom au bar.")}
  const pseudo=$("#ps").value.trim()||"Anonyme",comment=$("#cm").value.trim();localStorage.setItem("pseudo",pseudo);
  const btn=$("#go");btn.disabled=true;btn.textContent="Envoi…";
  try{
    if(!b.id){
      let row=b.osm_id?(await sb.from("bars").select("id").eq("osm_id",b.osm_id).maybeSingle()).data:null;
      if(!row){const r=await sb.from("bars").insert({osm_id:b.osm_id||null,name:b.name,lat:b.lat,lng:b.lng,address:b.address||null}).select("id").single();if(r.error)throw r.error;row=r.data}
      b={...b,id:row.id}}
    const photos=[];
    for(const f of draft.files){const p=`${session.user.id}/${crypto.randomUUID()}.jpg`;const u=await sb.storage.from("photos").upload(p,await shrink(f),{contentType:"image/jpeg"});if(u.error)throw u.error;photos.push(p)}
    const r=await sb.from("reviews").insert({bar_id:b.id,rating:draft.r,comment:comment||null,photos,author:pseudo});if(r.error)throw r.error;
    toast("Avis publié 🍺");gTmp.clearLayers();await load();
    show((await sb.from("bars_stats").select("*").eq("id",b.id).single()).data||b)
  }catch(e){btn.disabled=false;btn.textContent="Publier l’avis";toast("Échec de l’envoi : "+(e.message||"réessayez."))}}

/* ---------- Compte (lien magique par e-mail) ---------- */
function ui(){$("#auth").textContent=session?"Déconnexion":"Connexion";const g=$("#go");if(g&&!g.disabled)g.textContent=session?"Publier l’avis":"Se connecter pour publier"}
async function login(){const email=prompt("Votre e-mail : nous vous envoyons un lien de connexion.");if(!email)return;const{error}=await sb.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:location.origin+location.pathname}});toast(error?error.message:"Lien envoyé : ouvrez-le depuis votre boîte mail.")}
$("#auth").onclick=()=>session?sb.auth.signOut():login();
sb.auth.getSession().then(({data})=>{session=data.session;ui()});
sb.auth.onAuthStateChange((_e,s)=>{session=s;ui()});

/* ---------- Ajout manuel + démarrage ---------- */
$("#add").onclick=()=>{close();addMode=true;$("#hint").hidden=false};
$("#cx").onclick=()=>{addMode=false;$("#hint").hidden=true};
(async()=>{
  const m=/^#bar-([0-9a-f-]{36})$/.exec(location.hash);
  if(m){const r=await sb.from("bars_stats").select("*").eq("id",m[1]).maybeSingle();if(r.data){map.setView([r.data.lat,r.data.lng],17);show(r.data);return}}
  load()})();
</script>
</body>
</html>
